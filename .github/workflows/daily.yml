name: river-city-daily

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  pull_request:
    paths:
      - "scripts/research_worker.mjs"
      - "scripts/test_research.clj"
      - "src/**"
      - "resources/**"
      - "test/**"
      - "bb.edn"
      - "deps.edn"
      - ".github/workflows/daily.yml"
  push:
    branches: [main]
    paths-ignore:
      - "data/research/**"
      - "data/normalized/**"
      - "projections/**"
      - "charts/**"
      - "maps/**"
      - "reports/daily/**"

permissions:
  contents: read

concurrency:
  group: river-city-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: "1.12.0.1530"
          bb: "1.12.208"
      - run: bb validate
      - run: bb test

  daily:
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: "1.12.0.1530"
          bb: "1.12.208"
      - name: Run PortWatch vertical slice
        if: github.event_name != 'pull_request'
        run: bb daily
      - name: Commit generated River City state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add --all -- data/normalized data/research projections reports/daily charts maps
          if git diff --cached --quiet; then
            echo "No generated artifacts changed."
            exit 0
          fi

          disallowed=$(git diff --cached --name-only | grep -Ev '^(data/research/|data/normalized/|projections/|reports/daily/|charts/|maps/)' || true)
          if [ -n "$disallowed" ]; then
            echo "Refusing generated commit with disallowed staged paths:" >&2
            printf '%s\n' "$disallowed" >&2
            exit 1
          fi

          git config user.name "river-city-bot"
          git config user.email "river-city-bot@users.noreply.github.com"
          git commit -m "ledger: update River City generated state"
          git pull --rebase origin main
          git push origin HEAD:main
