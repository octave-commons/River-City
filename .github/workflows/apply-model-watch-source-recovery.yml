name: apply-model-watch-source-recovery

on:
  push:
    branches:
      - fix/model-watch-source-recovery

permissions:
  contents: write

concurrency:
  group: apply-model-watch-source-recovery
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Apply exact source-recovery repair
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path("scripts/model_watch.mjs")
          source = script.read_text()
          old = '''    const previous = previousSources.get(source.id);
              if (source.ok === false) continue;
              const isNewSource = !previous && previousSources.size > 0;
          '''
          new = '''    const previous = previousSources.get(source.id);
              if (source.ok === false) continue;
              if (previous && !previous.observed_at) continue;
              const isNewSource = !previous && previousSources.size > 0;
          '''
          if old in source:
              script.write_text(source.replace(old, new, 1))
          elif new not in source:
              raise SystemExit("model_watch.mjs patch target missing")

          config = Path("resources/river_city/model-watch.json")
          value = config.read_text()
          old_url = "https://developers.openai.com/api/docs/models/gpt"
          new_url = "https://developers.openai.com/api/docs/models.md"
          if old_url in value:
              config.write_text(value.replace(old_url, new_url, 1))
          elif new_url not in value:
              raise SystemExit("model-watch.json URL target missing")

          tests = Path("test/model_watch.test.mjs")
          value = tests.read_text()
          old_fixture = '''      ok: true,
                facts,
                facts_digest: JSON.stringify(facts)
          '''
          new_fixture = '''      ok: true,
                observed_at: "2026-08-31T12:00:00.000Z",
                facts,
                facts_digest: JSON.stringify(facts)
          '''
          if old_fixture in value:
              value = value.replace(old_fixture, new_fixture, 1)
          elif new_fixture not in value:
              raise SystemExit("test fixture patch target missing")

          marker = 'test("silently seeds an official source that recovers without a prior good observation"'
          anchor = 'test("alerts when an official package quota changes", () => {\n'
          addition = '''test("silently seeds an official source that recovers without a prior good observation", () => {
            const previousProvider = providerSnapshot();
            previousProvider.official_sources = [{
              id: "official",
              url: "https://example.test/pricing",
              ok: false,
              stale: false,
              error: "HTTP 404 Not Found",
              facts: [],
              facts_digest: JSON.stringify([])
            }];
            const currentProvider = providerSnapshot({facts: ["gpt a input $1 output $5 per 1m tokens"]});
            assert.equal(detectMaterialChanges(snapshot(previousProvider), snapshot(currentProvider), config).length, 0);
          });

          test("preserves material fact detection after recovery from a stale good observation", () => {
            const previousProvider = providerSnapshot({facts: ["gpt a input $1 output $5 per 1m tokens"]});
            previousProvider.official_sources[0] = {
              ...previousProvider.official_sources[0],
              ok: false,
              stale: true,
              error: "request timed out"
            };
            const currentProvider = providerSnapshot({facts: ["gpt a input $1.5 output $5 per 1m tokens"]});
            const changes = detectMaterialChanges(snapshot(previousProvider), snapshot(currentProvider), config);
            assert.equal(changes.length, 1);
            assert.equal(changes[0].kind, "official-commercial-facts");
          });

          '''
          if marker not in value:
              if anchor not in value:
                  raise SystemExit("test insertion anchor missing")
              value = value.replace(anchor, addition + anchor, 1)
          tests.write_text(value)
          PY

      - name: Verify repair
        run: |
          node --check scripts/model_watch.mjs
          node --test test/model_watch.test.mjs
          node -e 'JSON.parse(require("fs").readFileSync("resources/river_city/model-watch.json", "utf8"))'

      - name: Commit exact repair
        run: |
          set -euo pipefail
          git add -- scripts/model_watch.mjs test/model_watch.test.mjs resources/river_city/model-watch.json
          if git diff --cached --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git config user.name "river-city-bot"
          git config user.email "river-city-bot@users.noreply.github.com"
          git commit -m "fix: seed recovered model sources without false alerts"
          git push origin HEAD:fix/model-watch-source-recovery
